steps:
  # Step 1: Build the Docker image with a unique tag (the commit SHA) for versioning
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/eventli-repo/eventli-app:$COMMIT_SHA'
      # Pass ONLY the public variables needed for the Next.js build process
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=$_NEXT_PUBLIC_SITE_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_RECAPTCHA_SITE_KEY=$_NEXT_PUBLIC_RECAPTCHA_SITE_KEY'
      - '.'

  # Step 2: Push the uniquely tagged image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/eventli-repo/eventli-app:$COMMIT_SHA'

  # Step 3: Deploy the new image revision to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'evintli-webapp'  # Your Cloud Run service name
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/eventli-repo/eventli-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'

# Define substitution variables that will be set in the Cloud Build Trigger
substitutions:
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
  _NEXT_PUBLIC_SITE_URL: ''
  _NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ''

# ✅ ADD THIS BLOCK TO FIX THE LOGGING ERROR
options:
  logging: CLOUD_LOGGING_ONLY